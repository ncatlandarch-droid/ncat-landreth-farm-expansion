<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" style="background-color: #0f172a; font-family: Inter, system-ui, sans-serif;">
