    <line x1="0" y1="360" x2="600" y2="360" />
    <line x1="150" y1="0" x2="150" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="450" y1="0" x2="450" y2="480" />
  </g>

  <!-- Parcel Polygon -->
  <path d="M 358.8,79.3 L 329.0,72.7 L 307.0,67.3 L 265.0,56.7 L 246.5,52.5 L 230.4,50.0 L 235.0,426.8 L 235.1,430.0 L 369.6,417.5 L 367.6,352.4 L 366.2,310.9 L 358.8,79.3 Z " fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)" />

