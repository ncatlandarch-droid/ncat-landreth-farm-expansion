  <rect x="20" y="405" width="560" height="55" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" />
  <text x="35" y="428" fill="#94a3b8" font-size="10">DEEDED ACRES</text>
  <text x="35" y="448" fill="#f8fafc" font-size="16" font-weight="bold">10.00 AC</text>

  <text x="160" y="428" fill="#94a3b8" font-size="10">GIS CALC ACRES</text>
  <text x="160" y="448" fill="#f8fafc" font-size="16" font-weight="bold">10.00 AC</text>

  <text x="295" y="428" fill="#94a3b8" font-size="10">MARKET LAND VALUE</text>
