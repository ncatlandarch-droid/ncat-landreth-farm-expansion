  <text x="32" y="60" fill="#f1f5f9" font-size="12" font-weight="600">3508 WILSONWOOD RD</text>
  <text x="32" y="76" fill="#94a3b8" font-size="11">PIN: 7884-76-5949 | AG-Agricultural</text>

